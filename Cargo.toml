[package]
name = "xoa-proxy"
version = "0.1.3"
edition = "2021"
description = "XOA Deploy Proxy — HTTPS+gunzip bridge for XAPI VM.import"

[lib]
name = "xoa_proxy_lib"
path = "src/lib.rs"

[[bin]]
name = "xoa-proxy"
path = "src/main.rs"

[dependencies]
# Async runtime
# Only the runtime, TCP listener, shutdown signals, stream I/O and mutex used
# by the proxy. `full` also enables unused fs/process/stdio features.
tokio = { version = "1", default-features = false, features = ["macros", "rt", "net", "signal", "sync", "io-util", "time"] }

# HTTP server
# The service only exposes a GET route with Query and serves HTTP/1.
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query"] }

# HTTP client — rustls only, no OpenSSL dep (critical for musl/XCP-ng static builds)
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls-webpki-roots",
] }

# Async gzip decompression (tokio-native, zero-copy pipeline)
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

# Adapter: reqwest bytes_stream ↔ AsyncRead, AsyncRead ↔ Stream<Bytes>
tokio-util = { version = "0.7", features = ["io"] }
# Stream traits/adapters do not need the bundled futures executor.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
http-body = "1"

# Deserialize for axum Query extractor in handler.rs
serde = { version = "1", features = ["derive"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }

# Error handling
anyhow = "1"
url = "2.5.8"

[dev-dependencies]
wiremock       = "0.6"
flate2         = "1"
tower          = { version = "0.4", features = ["util"] }
tokio          = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util", "time", "test-util"] }
http           = "1"
http-body-util = "0.1"

[profile.release]
# LTO + single codegen unit → smaller binary, important for Dom0 deployment
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
