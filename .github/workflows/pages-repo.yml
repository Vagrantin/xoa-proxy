name: Publish yum repo to GitHub Pages
run-name: "Publish yum repo (${{ github.event_name }}${{ inputs.promotion_id && format(' {0}', inputs.promotion_id) || '' }})"

# Publishes two signed, yum-resolvable channels (xcp-hl#154):
#   stable  https://vagrantin.github.io/xoa-proxy/8.3/x86_64/          exactly stable.json (promotions branch)
#   testing https://vagrantin.github.io/xoa-proxy/testing/8.3/x86_64/  the newest candidates (pre-releases)
# Installed hosts keep the stable URL; the testing .repo is disabled by default.
#
# workflow_run, not `release: published`, is what triggers this: the build
# workflow publishes its release with the default GITHUB_TOKEN, and events
# authored by that token deliberately do not start further workflows.
#
# Legacy since xcp-hl#190: rpm.xcp-hl.org (xcp-hl-rpm) is canonical. Kept until hosts have moved.
on:
  workflow_run:
    workflows: ["Build and Sign XOA-proxy RPM"]
    types: [completed]
  workflow_dispatch:
    inputs:
      promotion_id:
        description: 'Set by prod/promote so it can wait for this exact run'
        required: false
        default: ''

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # XCP-ng series this repo targets. Bump when XCP-HL rebases onto a new
  # release; the path is part of the baseurl every host carries, so old
  # trees should keep being published rather than moved.
  XCPNG_SERIES: "8.3"
  REPO_ARCH: "x86_64"
  # Testing serves the N newest candidates (pre-releases). Stable serves only
  # what stable.json lists, so an abandoned higher build can never resurface
  # there as an upgrade.
  KEEP_CANDIDATES: "5"

jobs:
  build:
    # workflow_run fires on every completion, failures included.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install createrepo_c
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c

      # The stable channel is exactly stable.json on the promotions branch, read when this run starts,
      # so a queued run never publishes an older set (jenkins-infra docs/promotion-gate.md, xcp-hl#154).
      - name: Read the promotion record
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin promotions
          echo "PROMOTIONS_COMMIT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          git show FETCH_HEAD:stable.json > stable.json
          jq -c '{generation, latest, entries: [.entries[] | {tag, status}]}' stable.json

      - name: Build stable and testing trees
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STABLE_JSON: stable.json
          PKG_GLOB_RE: '^xoa-proxy-.*\.rpm$'
        run: bash pages/build-site.sh

      - name: Sign repository metadata
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" --import

          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          sleep 1

          # Each channel has its own signed metadata.
          for REPOMD in "_site/${XCPNG_SERIES}/${REPO_ARCH}/repodata/repomd.xml" \
                        "_site/testing/${XCPNG_SERIES}/${REPO_ARCH}/repodata/repomd.xml"; do
            gpg --batch --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
              --armor --detach-sign --digest-algo sha256 \
              -u "XCP-ng Community Edition" \
              --output "${REPOMD}.asc" "${REPOMD}"
            gpg --verify "${REPOMD}.asc" "${REPOMD}"
          done
          echo "stable and testing repomd.xml signed"

      - name: Assemble site
        run: |
          set -euo pipefail
          cp pages/index.html      _site/
          cp pages/*.repo          _site/
          cp xcp-ng-ce-public.asc  _site/
          touch _site/.nojekyll
          echo "▶ site root:"
          ls -la _site/

      - name: Report published size
        run: |
          set -euo pipefail
          mb=$(( $(du -sb _site | cut -f1) / 1024 / 1024 ))
          echo "▶ site size: ${mb} MiB"
          # GitHub Pages caps a published site at 1 GiB. Keeping every release is
          # comfortable today but will be an issue later, checking the usage.
          if [ "${mb}" -gt 800 ]; then
            echo "::warning::_site is ${mb} MiB, approaching the 1 GiB Pages limit, consider pruning old RPMs"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
